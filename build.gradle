plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.speakerid'
    compileSdk 34

    defaultConfig {
        applicationId "com.speakerid"
        minSdk 26                    // Android 8.0+ (NNAPI support)
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // Abilita multidex per dipendenze pesanti
        multiDexEnabled true

        // ABI filters: arm64 per Snapdragon 8 Elite
        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                         'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    // Packaging per evitare conflitti
    packagingOptions {
        pickFirst 'lib/arm64-v8a/libc++_shared.so'
        pickFirst 'lib/x86_64/libc++_shared.so'
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
    }

    // Assets per modelli ONNX (opzionale - se vuoi includerli nell'APK)
    androidResources {
        noCompress 'onnx', 'tflite', 'bin'
    }
}

dependencies {
    // Android core
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.multidex:multidex:2.0.1'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'

    // ─────────────────────────────────────────
    // ONNX Runtime Android
    // Per inferenza modelli speaker embedding
    // ─────────────────────────────────────────
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.17.0'

    // ─────────────────────────────────────────
    // FFmpegKit - Estrazione audio dal video
    // ─────────────────────────────────────────
    implementation 'com.arthenica:ffmpeg-kit-full:6.0-2'

    // ─────────────────────────────────────────
    // File handling
    // ─────────────────────────────────────────
    implementation 'androidx.documentfile:documentfile:1.0.1'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}